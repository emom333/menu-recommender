name: Build Dentec Lab Manager (Windows)

on:
  push:
    paths:
      - "dentec_lab/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dentec_lab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR (bundled with the app)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          & "C:\Program Files\Tesseract-OCR\tesseract.exe" --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Diagnose native crashes at process exit (informational)
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: |
          python -c "import cv2, pymupdf, sqlalchemy, reportlab; print('libs ok')"; "exit code (libs only): $LASTEXITCODE"
          python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); print('qt app ok')"; "exit code (QApplication): $LASTEXITCODE"
          python -c "from PySide6.QtWidgets import QApplication, QWidget; app = QApplication([]); w = QWidget(); w.show(); app.processEvents(); print('widget ok')"; "exit code (widget): $LASTEXITCODE"
          python -c "import sys; sys.argv=['x']; import runpy; from dentec.ui.main_window import MainWindow; print('import ok')"; "exit code (import UI): $LASTEXITCODE"

      - name: Run test suite on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm DentecLab.spec

      - name: Add sample data, documentation and Tesseract
        shell: pwsh
        run: |
          Copy-Item -Recurse sample_data dist\DentecLab\sample_data
          Copy-Item -Recurse docs dist\DentecLab\docs
          Copy-Item README.md dist\DentecLab\
          Copy-Item -Recurse "C:\Program Files\Tesseract-OCR" dist\DentecLab\tesseract

      - name: Smoke-test the built .exe (offline self-test incl. every screen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\DentecLab\DentecLab.exe -ArgumentList "--self-test","--ui" -Wait -PassThru
          Get-Content dentec_selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path dentec_selftest.txt -Pattern "SELF-TEST PASSED")) { throw "self-test did not pass" }
          if (-not (Select-String -Path dentec_selftest.txt -Pattern "OCR: Tesseract")) { throw "bundled Tesseract not found" }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\DentecLab -DestinationPath DentecLab-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DentecLab-Windows
          path: dentec_lab/DentecLab-Windows.zip
          retention-days: 90
